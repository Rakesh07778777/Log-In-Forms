            <button type="button" class="social-signin-btn linkedin-btn">

                <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>

          <p class="register-link-text">
            Already have an account ? <a href="#" class="register-link" id="showLogin">Login here</a>
          </p>
        </form>
      </div>
    </div>

    <!-- Right Panel - Decorative Graphics -->
    <div class="dripspace-graphics-panel">
      <div class="graphics-container">
        <!-- Login Image -->
        <img 
          id="loginImage" 
          src="https://raw.githubusercontent.com/Rakesh07778777/Drip-Space/main/image%20copy%2051.png" 
          alt="Login" 
          class="panel-image active"
        >
        <!-- Register Image -->
        <img 
          id="registerImage" 
          src="https://images.unsplash.com/photo-1557683316-973673baf926?w=800&h=1200&fit=crop"

  </div>
</div>

<style>
  /* Reset and Base Styles */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow-x: hidden;
  }

  /* Main Container */
  .dripspace-login-container {
    display: flex;
    min-height: 100vh;
    width: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    /* background: linear-gradient(135deg, #1a0322 0%, #260448 25%, #4a0352 50%, #202020 75%, #050716 100%); */
    /* background-size: 400% 400%; */
    /* animation: gradientShift 15s ease infinite; */
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  /* Animated Background */
  /* .dripspace-login-container::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: conic-gradient(
      from 0deg at 50% 50%,
      transparent 0deg,
      rgba(139, 92, 246, 0.1) 90deg,
      transparent 180deg,
      rgba(168, 85, 247, 0.1) 270deg,
      transparent 360deg
    );
    animation: rotate 20s linear infinite;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  @keyframes rotate {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  } */

  /* Login Box */
  .dripspace-login-box {
    display: flex;
    width: 100%;
    max-width: 1100px;
    min-height: 600px;
    overflow: hidden;
    box-shadow: 
      0 20px 60px rgba(139, 92, 246, 0.4),
      0 0 100px rgba(168, 85, 247, 0.2),
      inset 0 0 0 1px rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(20px);
    border-radius: 32px;
    position: relative;
    z-index: 1;
  }

  /* Form Panel */
  .dripspace-form-panel {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(15, 1, 35, 0.9) 0%, rgba(43, 1, 85, 0.9) 100%);
    transition: opacity 0.4s ease;
    position: relative;
    padding: 40px 20px;
  }

  .dripspace-form-panel::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: radial-gradient(circle at 20% 50%, rgba(139, 92, 246, 0.05) 0%, transparent 50%);
    pointer-events: none;
  }

  .dripspace-form-wrapper {
    width: 100%;
    max-width: 420px;
    position: relative;
    z-index: 2;
  }

  /* Welcome Text */
  .dripspace-welcome-title {
    font-size: 2rem;
    font-weight: 700;
    color: #fff;
    background-clip: text;
    margin-bottom: 8px;
    text-align: center;
    animation: titleGlow 3s ease-in-out infinite;
  }

  @keyframes titleGlow {
    0%, 100% { filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.3)); }
    50% { filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.6)); }
  }

  .dripspace-welcome-subtitle {
    font-size: 14px;
    color: #6b7280;
    margin-bottom: 32px;
    text-align: center;
    line-height: 1.5;
  }

  /* Form Styles */
  .dripspace-login-form {
    width: 100%;
  }

  .login-input-block {
    margin-bottom: 1.2rem;
  }

  .input-label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }

  .required-asterisk {
    color: #ec4899;
  }

  .form-input-field {
    width: 100%;
    padding: 14px 18px;
    font-size: 14px;
    border-radius: 16px;
    outline: none;
    border: none;
    transition: all 0.3s ease;
    color: #000000;
  }

  .form-input-field:focus {
    background: linear-gradient(rgb(200, 200, 200), rgb(231, 231, 231)) padding-box,
                linear-gradient(135deg, #000000, #000000, #000000) border-box;
    box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1),
                0 8px 24px rgba(139, 92, 246, 0.2);
    transform: translateY(-2px);
  }

  .form-input-field::placeholder {
    color: #9ca3af;
  }

  /* Password Input Wrapper */
  .password-input-wrapper {
    position: relative;
  }

  .password-toggle-btn {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    color: rgb(3, 3, 3);
    cursor: pointer;
    padding: 8px;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    transition: all 0.3s ease;
  }

  .password-toggle-btn:hover {
    box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
    background: #fff;
  }

  /* Form Options Row */
  .form-options-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .remember-checkbox-wrapper {
    display: flex;
    align-items: center;
    cursor: pointer;
  }

  .checkbox-input {
    width: 18px;
    height: 18px;
    margin-right: 8px;
    cursor: pointer;
    accent-color: #8b5cf6;
  }

  .checkbox-label {
    font-size: 14px;
    color: #4b5563;
    font-weight: 500;
  }

  .forgot-password-link {
    font-size: 14px;
    color: #bfbfbf;
    background-clip: text;
    text-decoration: none;
    font-weight: 600;
    transition: all 0.3s ease;
  }

  .forgot-password-link:hover {
    filter: brightness(1.2);
    text-decoration: underline;
  }

  /* Login Button */
  .premium-login-btn {
    width: 100%;
    padding: 16px;
    font-size: 16px;
    font-weight: 600;
    color: #ffffff;
    background: #2E003E;
    background-size: 200% 200%;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.4s ease;
    margin-bottom: 24px;
    box-shadow: 0 8px 24px rgba(139, 92, 246, 0.4);
    position: relative;
    overflow: hidden;
  }

  .premium-login-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    transition: left 0.5s ease;
  }

  .premium-login-btn:hover::before {
    left: 100%;
  }

  .premium-login-btn:hover {
    box-shadow: 0 12px 32px rgba(139, 92, 246, 0.6);
    background-position: 100% 0;
  }

  .premium-login-btn:active {
    transform: translateY(-1px);
  }

  /* Divider */
  .login-divider {
    position: relative;
    text-align: center;
    margin-bottom: 24px;
  }

  .login-divider::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #e5e7eb, transparent);
  }

  .divider-text {
    position: relative;
    display: inline-block;
    padding: 0 16px;
    font-size: 14px;
    color: #9ca3af;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(250, 245, 255, 0.9) 100%);
    font-weight: 500;
  }

  /* Google Sign In Button */
  .google-signin-btn {
    width: 100%;
    padding: 14px;
    font-size: 14px;
    font-weight: 500;
    color: #1a1a1a;
    background: white;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    transition: all 0.3s ease;
    margin-bottom: 24px;
  }

  .google-signin-btn:hover {
    box-shadow: 0 8px 20px rgba(139, 92, 246, 0.3);
  }

  /* Social Buttons Container */
  .social-buttons-container {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
  }

  .social-signin-btn {
    flex: 1;
    padding: 14px 8px;
    font-size: 13px;
    font-weight: 600;
    color: #1a1a1a;
    background: white;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.3s ease;
  }

  .social-signin-btn:hover {
    box-shadow: 0 8px 20px rgba(139, 92, 246, 0.3);
    background: #cab4f8;
  }

  /* Register Link */
  .register-link-text {
    text-align: center;
    font-size: 14px;
    color: #6b7280;
    line-height: 1.6;
  }

  .register-link {
    color: #fff;
    background-clip: text;
    text-decoration: none;
    font-weight: 600;
    transition: all 0.3s ease;
  }

  .register-link:hover {
    filter: brightness(1.2);
    text-decoration: underline;
  }

  /* Right Panel - Graphics Section */
  .dripspace-graphics-panel {
    flex: 1;
    background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 50%, #6366f1 100%);
    position: relative;
    overflow: hidden;
    border-top-right-radius: 32px;
    border-bottom-right-radius: 32px;
  }

  .graphics-container {
    position: relative;
    width: 100%;
    height: 100%;
  }

  .panel-image {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  .panel-image.active {
    opacity: 1;
  }

  .purple-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: url(BG-Images/joanna-kosinska-RE-8WswW95o-unsplash.jpg);
    background-size: cover;
    background-position: center;
    mix-blend-mode: multiply;
    z-index: 1;
  }

  /* ============================================ */
  /* RESPONSIVE DESIGN - TABLETS AND MOBILE */
  /* ============================================ */

  /* Large Tablets and Small Desktops (1024px and below) */
  @media (max-width: 1024px) {
    .dripspace-login-box {
      max-width: 900px;
      min-height: 550px;
    }

    .dripspace-welcome-title {
      font-size: 1.75rem;
    }

    .dripspace-form-wrapper {
      max-width: 380px;
    }
  }

  /* Tablets (768px and below) */
  @media (max-width: 768px) {
    .dripspace-login-container {
      padding: 15px;
    }

    .dripspace-login-box {
      flex-direction: column;
      max-width: 100%;
      min-height: auto;
      border-radius: 24px;
    }

    .dripspace-form-panel {
      padding: 40px 30px;
    }
    
    .dripspace-form-wrapper {
      max-width: 100%;
    }

    .dripspace-welcome-title {
      font-size: 1.65rem;
    }

    .dripspace-welcome-subtitle {
      font-size: 13px;
      margin-bottom: 28px;
    }

    /* Hide graphics panel on tablets */
    .dripspace-graphics-panel {
      display: none;
    }

    /* Social buttons stack on tablets */
    .social-buttons-container {
      flex-direction: column;
    }

    .social-signin-btn {
      flex-direction: row;
      gap: 12px;
      padding: 14px 16px;
    }

    .form-input-field {
      padding: 13px 16px;
    }

    .premium-login-btn {
      padding: 15px;
    }
  }

  /* Mobile Landscape and Small Tablets (600px and below) */
  @media (max-width: 600px) {
    .dripspace-login-container {
      padding: 10px;
      align-items: flex-start;
    }
    
    .dripspace-login-box {
      border-radius: 20px;
      min-height: auto;
      margin: 10px 0;
    }
    
    .dripspace-form-panel {
      padding: 30px 20px;
    }
    
    .dripspace-form-wrapper {
      max-width: 100%;
      padding: 0;
    }
    
    .dripspace-welcome-title {
      font-size: 1.5rem;
    }
    
    .dripspace-welcome-subtitle {
      font-size: 13px;
      margin-bottom: 24px;
    }

    .login-input-block {
      margin-bottom: 1rem;
    }

    .input-label {
      font-size: 13px;
      margin-bottom: 6px;
    }

<script>
  // Toggle between login and register forms with image change
  const loginPanel = document.getElementById('loginPanel');
  const registerPanel = document.getElementById('registerPanel');
  const showRegisterBtn = document.getElementById('showRegister');
  const showLoginBtn = document.getElementById('showLogin');
  const loginImage = document.getElementById('loginImage');
  const registerImage = document.getElementById('registerImage');

  showRegisterBtn.addEventListener('click', function(e) {
    e.preventDefault();
    loginPanel.style.display = 'none';
    registerPanel.style.display = 'flex';
    
    // Change image
    loginImage.classList.remove('active');
    registerImage.classList.add('active');
  });

  showLoginBtn.addEventListener('click', function(e) {
    e.preventDefault();
    registerPanel.style.display = 'none';
    loginPanel.style.display = 'flex';
    
    // Change image
    registerImage.classList.remove('active');
    loginImage.classList.add('active');
  });

  // Password Toggle Functionality for Login
  const togglePassword = document.getElementById('togglePassword');
  const passwordInput = document.getElementById('password');

  togglePassword.addEventListener('click', function() {
    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
    passwordInput.setAttribute('type', type);
  });

  // Password Toggle Functionality for Registration
  const toggleRegPassword = document.getElementById('toggleRegPassword');
  const regPasswordInput = document.getElementById('reg-password');

  toggleRegPassword.addEventListener('click', function() {
    const type = regPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
    regPasswordInput.setAttribute('type', type);
  });

  // Login Form Validation
  const loginForm = document.getElementById('loginForm');
  
  loginForm.addEventListener('submit', function(e) {
    e.preventDefault();
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    if (!email || !password) {
      alert('Please fill in all required fields');
      return;
    }
    
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email)) {
      alert('Please enter a valid email address');
      return;
    }
    
    console.log('Login attempt:', { email, password: '***' });
    alert('Login successful! This would connect to your backend.');
  });

  // Registration Form Validation
  const registerForm = document.getElementById('registerForm');
  
  registerForm.addEventListener('submit', function(e) {
    e.preventDefault();
    
    const name = document.getElementById('reg-name').value;
    const email = document.getElementById('reg-email').value;
    const password = document.getElementById('reg-password').value;
    
    if (!name || !email || !password) {
      alert('Please fill in all required fields');
      return;
    }
    
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email)) {
      alert('Please enter a valid email address');
      return;
    }
    
    if (password.length < 6) {
      alert('Password must be at least 6 characters long');
      return;
    }
    
    console.log('Registration attempt:', { name, email, password: '***' });
    alert('Registration successful! This would connect to your backend.');
  });

  // Add focus effects to inputs
  const inputs = document.querySelectorAll('.form-input-field');
  
  inputs.forEach(input => {
    input.addEventListener('focus', function() {
      this.style.transition = 'all 0.3s ease';
    });
  });

  // Prevent form submission on enter in social buttons
  document.querySelectorAll('.social-signin-btn, .google-signin-btn').forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      console.log('Social login clicked:', this.querySelector('span').textContent);
      alert('Social login would be handled here!');
    });
  });
</script>
