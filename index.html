<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>ZippTech form Page</title>
</head>
<body>
<iframe src='https://my.spline.design/sphereportfolio-a0XV8wAPGhRAXnYC0Mie778A/' frameborder='0' width='100%' height='100%' class="spline-3d"></iframe>
<header>ZIPPTECH</header>

<div class="auth-container" id="loginForm">
  <h2>Sign In</h2>
  <form>
    <label>Email</label>
    <input type="email" placeholder="Enter your email" required>
    <input type="password" placeholder="Password" required>
    <button type="submit" class="primary-btn">Next</button>
    <div class="link">Trouble Signing In?</div>
    <div class="divider">Or</div>
    <button type="button" class="secondary-btn" onclick="showSignUp()">Create Account</button>
  </form>
</div>

<div class="auth-container" id="signupForm" style="display:none;">
  <h2>Create Account</h2>
  <form>
    <label>Full Name</label>
    <input type="text" placeholder="Your name" required>
    <label>Email</label>
    <input type="email" placeholder="Enter your email" required>
    <label>Password</label>
    <input type="password" placeholder="Create a password" required>
    <button type="submit" class="primary-btn">Create Account</button>
    <div class="divider">Or</div>
    <button type="button" class="secondary-btn" onclick="showLogin()">Back to Sign In</button>
  </form>
</div>

<footer>
  <p>ZippTech © 2025  <a href="#">Privacy & Legal</a>  <a href="#">Contact</a></p>
</footer>

<script src="script.js"></script>

</body>
</html>
